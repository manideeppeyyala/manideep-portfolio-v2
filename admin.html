<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Peyyala Manideep Portfolio</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔒</text></svg>">
</head>
<body class="admin-body">

<div class="bg-grid"></div>
<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>

<!-- LOGIN GATE -->
<div id="loginGate" class="admin-gate" style="display:none;">
  <div class="admin-gate-card">
    <a href="index.html" class="logo">PM<span>.dev</span></a>
    <p class="section-eyebrow" style="margin-top:24px;">ADMIN</p>
    <h1 class="section-title">Sign In</h1>
    <p class="section-sub">Enter the admin password you set as the <code>ADMIN_PASSWORD</code> environment variable in Vercel. First time here? See <code>SETUP.md</code>.</p>
    <form id="loginForm" class="contact-form">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••" required>
      <button type="submit" class="btn btn-gradient full">Sign In →</button>
      <p class="form-note" id="loginStatus"></p>
    </form>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="admin-dashboard" style="display:none;">
  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">PM<span>.dev</span></a>
      <p class="admin-title">Admin Dashboard</p>
      <div class="admin-nav-actions">
        <a href="index.html" target="_blank" class="btn btn-ghost btn-small">View Site ↗</a>
        <button id="logoutBtn" class="btn btn-outline btn-small">Sign Out</button>
      </div>
    </div>
  </nav>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <button class="admin-tab active" data-tab="overview">Overview</button>
      <button class="admin-tab" data-tab="hero">Hero</button>
      <button class="admin-tab" data-tab="about">About</button>
      <button class="admin-tab" data-tab="experience">Experience</button>
      <button class="admin-tab" data-tab="skills">Skills</button>
      <button class="admin-tab" data-tab="projects">Projects</button>
      <button class="admin-tab" data-tab="certifications">Achievements</button>
      <button class="admin-tab" data-tab="research">Research</button>
      <button class="admin-tab" data-tab="education">Education</button>
      <button class="admin-tab" data-tab="content">Content/Social</button>
      <button class="admin-tab" data-tab="socialStats">Social Analytics</button>
      <button class="admin-tab" data-tab="contact">Contact</button>
      <button class="admin-tab" data-tab="footer">Footer</button>
      <button class="admin-tab" data-tab="feedback">Feedback &amp; Ratings</button>
    </aside>

    <main class="admin-main" id="adminMain">
      <!-- rendered by admin.js -->
    </main>
  </div>
</div>

<div id="toast" class="admin-toast"></div>

<script src="content-schema.js"></script>
<script src="admin.js"></script>
</body>
</html>
